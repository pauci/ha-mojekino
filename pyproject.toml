[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]  # HA entities use class-level _attr_ lists

[tool.ruff.lint.isort]
known-first-party = ["api"]
known-third-party = ["homeassistant"]
